<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">แผนภูมิอภิธัมมปิฎก</title>
  <desc id="desc">ผังอภิธัมมปิฎกแบบคลิกได้ แบ่งเป็น ๗ คัมภีร์</desc>
  <style>
    text {
      fill: #1f2937;
      font-family: "Sarabun", "TH Sarabun New", "Tahoma", sans-serif;
      text-anchor: middle;
    }
    .root { font-size: 33px; font-weight: 700; }
    .head { font-size: 27px; font-weight: 700; }
    .desc { font-size: 20px; fill: #4b5563; }
    .line { stroke: #6b7280; stroke-width: 1.35; stroke-linecap: round; fill: none; }
    a { text-decoration: none; }
    a:hover text { fill: #1d4ed8; text-decoration: underline; }
  </style>

  <a href="/tipitaka-structure/#abhidhamma" target="_top">
    <text x="640" y="34" class="root">อภิธัมมปิฎก</text>
  </a>

  <line x1="640" y1="42" x2="640" y2="92" class="line" />
  <line x1="80" y1="92" x2="1200" y2="92" class="line" />

  <line x1="80" y1="92" x2="80" y2="124" class="line" />
  <line x1="267" y1="92" x2="267" y2="124" class="line" />
  <line x1="454" y1="92" x2="454" y2="124" class="line" />
  <line x1="640" y1="92" x2="640" y2="124" class="line" />
  <line x1="827" y1="92" x2="827" y2="124" class="line" />
  <line x1="1014" y1="92" x2="1014" y2="124" class="line" />
  <line x1="1200" y1="92" x2="1200" y2="124" class="line" />

  <circle cx="80" cy="124" r="1.7" fill="#6b7280" />
  <circle cx="267" cy="124" r="1.7" fill="#6b7280" />
  <circle cx="454" cy="124" r="1.7" fill="#6b7280" />
  <circle cx="640" cy="124" r="1.7" fill="#6b7280" />
  <circle cx="827" cy="124" r="1.7" fill="#6b7280" />
  <circle cx="1014" cy="124" r="1.7" fill="#6b7280" />
  <circle cx="1200" cy="124" r="1.7" fill="#6b7280" />

  <a href="/tipitaka-structure/#abhidhamma-dhammasangani" target="_top"><text x="80" y="166" class="head">ธัมมสังคณี</text></a>
  <text x="80" y="206" class="desc">
    <tspan x="80" dy="0">รวมกลุ่มธรรม</tspan>
    <tspan x="80" dy="32">กลุ่มละ ๓ และ</tspan>
    <tspan x="80" dy="32">กลุ่มละ ๒</tspan>
    <tspan x="80" dy="32">ทั้งหมด ๑๔๕ มาติกา</tspan>
  </text>

  <a href="/tipitaka-structure/#abhidhamma-vibhanga" target="_top"><text x="267" y="166" class="head">วิภังค์</text></a>
  <text x="267" y="206" class="desc">
    <tspan x="267" dy="0">การแจกกลุ่มธรรมะ</tspan>
    <tspan x="267" dy="32">ให้เห็น</tspan>
    <tspan x="267" dy="32">รายละเอียด</tspan>
    <tspan x="267" dy="32">รวม ๑๘ เรื่อง</tspan>
  </text>

  <a href="/tipitaka-structure/#abhidhamma-dhatukatha" target="_top"><text x="454" y="166" class="head">ธาตุกถา</text></a>
  <text x="454" y="206" class="desc">
    <tspan x="454" dy="0">การจัดธรรม</tspan>
    <tspan x="454" dy="32">๑๒๕ อย่าง</tspan>
    <tspan x="454" dy="32">เข้าใน</tspan>
    <tspan x="454" dy="32">ขันธ์ อายตนะ ธาตุ</tspan>
  </text>

  <a href="/tipitaka-structure/#abhidhamma-puggalapannatti" target="_top"><text x="640" y="166" class="head">ปุคคลบัญญัตติ</text></a>
  <text x="640" y="206" class="desc">
    <tspan x="640" dy="0">การบัญญัติ</tspan>
    <tspan x="640" dy="32">บุคคลต่าง ๆ</tspan>
    <tspan x="640" dy="32">ตามคุณธรรม</tspan>
  </text>

  <a href="/tipitaka-structure/#abhidhamma-kathavatthu" target="_top"><text x="827" y="166" class="head">กถาวัตถุ</text></a>
  <text x="827" y="206" class="desc">
    <tspan x="827" dy="0">คำถาม</tspan>
    <tspan x="827" dy="32">คำตอบ</tspan>
    <tspan x="827" dy="32">รวม ๒๑๙ กถา</tspan>
  </text>

  <a href="/tipitaka-structure/#abhidhamma-yamaka" target="_top"><text x="1014" y="166" class="head">ยมก</text></a>
  <text x="1014" y="206" class="desc">
    <tspan x="1014" dy="0">อธิบาย</tspan>
    <tspan x="1014" dy="32">หลักธรรมสำคัญ</tspan>
    <tspan x="1014" dy="32">เป็นคู่ ๆ</tspan>
    <tspan x="1014" dy="32">รวม ๑๐ ยมก</tspan>
  </text>

  <a href="/tipitaka-structure/#abhidhamma-patthana" target="_top"><text x="1200" y="166" class="head">ปัฏฐาน</text></a>
  <text x="1200" y="206" class="desc">
    <tspan x="1200" dy="0">อธิบาย</tspan>
    <tspan x="1200" dy="32">ปัจจัย ๒๔</tspan>
    <tspan x="1200" dy="32">โดยพิสดาร</tspan>
  </text>
</svg>
