<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">แผนผังแสดงนิกายในพระพุทธศาสนายุคต้น</title>
  <desc id="desc">ผังต้นไม้แสดงนิกาย 18 ในพระพุทธศาสนา แตกแยกจากเถรวาทภายใน 200 ปีหลังพุทธปรินิพพาน</desc>
  <style>
    text {
      fill: #1f2937;
      font-family: "Sarabun", "TH Sarabun New", "Tahoma", sans-serif;
      text-anchor: middle;
    }
    .root { font-size: 30px; font-weight: 700; }
    .node { font-size: 24px; font-weight: 700; }
    .sub { font-size: 19px; font-weight: 400; fill: #6b7280; }
    .leaf { font-size: 22px; font-weight: 400; }
    .leaf-l { font-size: 22px; font-weight: 400; text-anchor: start; }
    .line { stroke: #6b7280; stroke-width: 1.35; stroke-linecap: round; fill: none; }
  </style>

  <!-- Root -->
  <text x="466" y="38" class="root">เถรวาท</text>
  <circle cx="466" cy="56" r="3" fill="#374151" />
  <line x1="466" y1="56" x2="466" y2="92" class="line" />

  <!-- Level 1 bar -->
  <line x1="223" y1="92" x2="710" y2="92" class="line" />

  <!-- L1: มหาสังฆิกะ -->
  <line x1="223" y1="92" x2="223" y2="114" class="line" />
  <circle cx="223" cy="114" r="3" fill="#374151" />
  <text x="223" y="142" class="node">มหาสังฆิกะ</text>
  <text x="223" y="168" class="sub">(แยกออกมาในสมัยถัดจาก ๑๐๐ ปีแรก)</text>

  <!-- L1: มหิสาสกะ -->
  <line x1="520" y1="92" x2="520" y2="114" class="line" />
  <circle cx="520" cy="114" r="3" fill="#374151" />
  <text x="520" y="142" class="node">มหิสาสกะ</text>
  <text x="520" y="168" class="sub">(แยกออกมาในสมัยหลัง)</text>

  <!-- L1: วัชชีปุตตกะ -->
  <line x1="710" y1="92" x2="710" y2="114" class="line" />
  <circle cx="710" cy="114" r="3" fill="#374151" />
  <text x="710" y="142" class="node">วัชชีปุตตกะ</text>
  <text x="710" y="168" class="sub">(แยกออกมาในสมัยหลัง)</text>

  <!-- L2 under มหาสังฆิกะ -->
  <line x1="223" y1="178" x2="223" y2="210" class="line" />
  <line x1="147" y1="210" x2="300" y2="210" class="line" />

  <line x1="147" y1="210" x2="147" y2="228" class="line" />
  <circle cx="147" cy="228" r="3" fill="#374151" />
  <text x="147" y="254" class="leaf">โคกุลิกะ</text>

  <line x1="300" y1="210" x2="300" y2="228" class="line" />
  <circle cx="300" cy="228" r="3" fill="#374151" />
  <text x="300" y="254" class="leaf">เอกพโยหาริกะ</text>

  <!-- L3 under โคกุลิกะ -->
  <line x1="147" y1="268" x2="147" y2="302" class="line" />
  <line x1="80" y1="302" x2="215" y2="302" class="line" />

  <line x1="80" y1="302" x2="80" y2="320" class="line" />
  <circle cx="80" cy="320" r="3" fill="#374151" />
  <text x="80" y="346" class="leaf">ปัณณัตติวาทะ</text>

  <line x1="215" y1="302" x2="215" y2="320" class="line" />
  <circle cx="215" cy="320" r="3" fill="#374151" />
  <text x="215" y="346" class="leaf">พหุลิยะ</text>
  <text x="215" y="372" class="sub">(พหุสสุติกะ)</text>

  <!-- L4: เจติยวาทะ -->
  <line x1="215" y1="380" x2="215" y2="414" class="line" />
  <circle cx="215" cy="414" r="3" fill="#374151" />
  <text x="215" y="440" class="leaf">เจติยวาทะ</text>

  <!-- L2 under มหิสาสกะ -->
  <line x1="520" y1="178" x2="520" y2="210" class="line" />
  <line x1="440" y1="210" x2="600" y2="210" class="line" />

  <line x1="440" y1="210" x2="440" y2="228" class="line" />
  <circle cx="440" cy="228" r="3" fill="#374151" />
  <text x="440" y="254" class="leaf">สัพพัตถิกวาทะ</text>

  <line x1="600" y1="210" x2="600" y2="228" class="line" />
  <circle cx="600" cy="228" r="3" fill="#374151" />
  <text x="600" y="254" class="leaf">ธัมมคุตติกะ</text>

  <!-- L3: กัสสปิกะ -->
  <line x1="440" y1="268" x2="440" y2="304" class="line" />
  <circle cx="440" cy="304" r="3" fill="#374151" />
  <text x="440" y="330" class="leaf">กัสสปิกะ</text>

  <!-- L4: สังกันติกะ -->
  <line x1="440" y1="344" x2="440" y2="380" class="line" />
  <circle cx="440" cy="380" r="3" fill="#374151" />
  <text x="440" y="406" class="leaf">สังกันติกะ</text>

  <!-- L5: สุตตวาทะ -->
  <line x1="440" y1="420" x2="440" y2="456" class="line" />
  <circle cx="440" cy="456" r="3" fill="#374151" />
  <text x="440" y="482" class="leaf">สุตตวาทะ</text>

  <!-- L2 under วัชชีปุตตกะ -->
  <line x1="710" y1="178" x2="710" y2="438" class="line" />

  <line x1="710" y1="258" x2="735" y2="258" class="line" />
  <circle cx="735" cy="258" r="3" fill="#374151" />
  <text x="752" y="264" class="leaf-l">ธัมมุตตริยะ</text>

  <line x1="710" y1="318" x2="735" y2="318" class="line" />
  <circle cx="735" cy="318" r="3" fill="#374151" />
  <text x="752" y="324" class="leaf-l">ภัทรยานิกะ</text>

  <line x1="710" y1="378" x2="735" y2="378" class="line" />
  <circle cx="735" cy="378" r="3" fill="#374151" />
  <text x="752" y="384" class="leaf-l">ฉันนาคาริกะ</text>

  <line x1="710" y1="438" x2="735" y2="438" class="line" />
  <circle cx="735" cy="438" r="3" fill="#374151" />
  <text x="752" y="444" class="leaf-l">สมิติยะ</text>
</svg>
