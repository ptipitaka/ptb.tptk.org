<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 920" role="img" aria-labelledby="title desc">
  <title id="title">แผนภูมิวินัยปิฎก</title>
  <desc id="desc">ผังวินัยปิฎก แยกเป็น มหาวิภังค์ ภิกขุนีวิภังค์ มหาวัคค์ จุลลวัคค์ และปริวาร พร้อมคำอธิบายและหมวดย่อยตามฉบับพิมพ์</desc>
  <style>
    text {
