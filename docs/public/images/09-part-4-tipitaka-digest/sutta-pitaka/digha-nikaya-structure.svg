  <title id="title">แผนภูมิทีฆนิกาย</title>
  <desc id="desc">ทีฆนิกาย สามวรรค รวมสามสิบสี่พระสูตร ตามลำดับฉบับพระไตรปิฎกฉบับประชาชน</desc>
