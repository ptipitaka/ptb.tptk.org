<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" role="img" aria-labelledby="title desc">
  <title id="title">แผนภูมิสุตตันตปิฎก</title>
  <desc id="desc">ผังสุตตันตปิฎก แยกเป็น ทีฆนิกาย มัชฌิมนิกาย สังยุตตนิกาย อังคุตตรนิกาย และขุททกนิกาย พร้อมวรรคและคัมภีร์ย่อย</desc>
